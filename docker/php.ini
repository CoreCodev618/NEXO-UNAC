; Configuración PHP para la imagen del piloto.
; Los límites acompañan RAG_MAX_UPLOAD_MB (20 MB) con margen para multipart.
upload_max_filesize = 25M
post_max_size = 26M
max_file_uploads = 10
memory_limit = 256M
max_execution_time = 180
max_input_time = 180

display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

date.timezone = America/Lima

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 10000

session.cookie_httponly = 1
session.use_strict_mode = 1
