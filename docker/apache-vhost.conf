ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Debian trae un Alias /icons/ -> /usr/share/apache2/icons/ que tapa el
    # sprite de la app. El alias explícito devuelve /icons/sprite.svg al repo.
    Alias /icons/ "/var/www/html/public/icons/"

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "/var/www/html/public/icons">
        Options -Indexes
        Require all granted
    </Directory>

    # No exponer archivos internos aunque alguien configure mal el vhost.
    <DirectoryMatch "^/var/www/html/(app|vendor|writable|tests|docker|python)">
        Require all denied
    </DirectoryMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
